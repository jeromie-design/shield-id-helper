name: Claude PR Review

# Free BugBot alternative: runs Claude on each pull request and posts findings,
# using the repo's .cursor/BUGBOT.md as the review checklist. Authenticated with
# a Claude subscription OAuth token (no per-token API billing) — generate it once
# with `claude setup-token` and store it as the repo secret CLAUDE_CODE_OAUTH_TOKEN.
#
# No credential, no review. The `preflight` job resolves whether the secret is
# present and `review` only runs if it is; otherwise `review` is SKIPPED and
# preflight emits a warning annotation and a job summary saying the PR was not
# reviewed. This is deliberate: when the credential was missing the action used
# to fail *inside* the review step, so the PR showed a red `review` check that
# looked like a review finding. Every PR was red, nobody could tell a real
# failure from a missing secret, and red checks became normal. A missing
# credential must never be able to masquerade as a review result.
#
# Third-party actions are pinned to a commit SHA (not a mutable tag) so the
# action's own code cannot change under us — the version tag is in the trailing
# comment. Bump both the SHA and the comment together when you update. Note that
# claude-code-action installs the Claude Code CLI at run time, so pinning the
# action does not pin the CLI's behaviour.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: read the code, comment on the PR, mint the OIDC token the
# action needs. No write access to contents.
permissions:
  contents: read
  pull-requests: write
  id-token: write

# One live review per PR: a new push cancels the superseded run instead of
# stacking another review (and another chunk of subscription usage) on top.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The `secrets` context is not readable from a job-level `if`, so whether the
  # credential exists has to be resolved in a step and handed on as an output.
  preflight:
    # Skip draft PRs and Dependabot's dependency bumps — review real changes.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      has_credential: ${{ steps.credential.outputs.has_credential }}
    steps:
      - name: Check for a review credential
        id: credential
        env:
          # Empty string when the secret is unset; also treated as absent when
          # it holds nothing but whitespace, which an accidental paste produces.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "$(printf '%s' "${CLAUDE_CODE_OAUTH_TOKEN:-}" | tr -d '[:space:]')" ]; then
            echo 'has_credential=true' >> "$GITHUB_OUTPUT"
            echo 'Review credential present: running the Claude review.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'has_credential=false' >> "$GITHUB_OUTPUT"
          echo "::warning title=Claude PR review did NOT run::Repo secret CLAUDE_CODE_OAUTH_TOKEN is unset or empty, so this PR was not reviewed. The skipped 'review' check is not a review result."
          {
            echo '## Claude PR review skipped: no credential'
            echo
            echo "The repo secret \`CLAUDE_CODE_OAUTH_TOKEN\` is unset or empty, so the"
            echo '**review did not run and this PR has not been reviewed by Claude.**'
            echo 'The `review` check is skipped rather than failed, so that a missing'
            echo 'secret can never be mistaken for a review finding.'
            echo
            echo 'To switch the review on, generate a subscription token with'
            echo '`claude setup-token` and store it on this repo:'
            echo
            echo '```'
            echo "gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  review:
    needs: preflight
    if: needs.preflight.outputs.has_credential == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a security-focused reviewer for this pull request.

            FIRST, read `.cursor/BUGBOT.md` at the repo root. Treat its invariants
            as the PRIMARY review checklist — this repo's real risk model lives
            there (tenant isolation, fail-closed enforcement, no-open-skip, XSS
            escaping, secret handling, schema parity, etc., depending on the repo).
            Then review the PR diff for anything that violates one of those
            invariants, plus clear correctness bugs and security issues.

            Rules of engagement:
            - Only raise issues you are confident are real. No nitpicks, no
              style-only comments, no praise-only noise.
            - Anchor specific findings to the exact line with inline comments.
            - Post one short top-level summary only if there are findings. If the
              PR is clean against the checklist, post a single brief
              "No issues found against BUGBOT.md" comment.
            - Most severe / most likely findings first.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
