# Cross-build shield-id-helper and publish per-OS zip bundles to a GitHub Release.
#
# Triggered by pushing a tag matching v*. Each zip contains the binary + the
# OS-appropriate install/uninstall scripts so a customer can download one
# archive, extract it, and run `install.<sh|ps1> <extension-id>`.
#
# Cut a release with:
#   git tag v1.0.0 && git push --tags

name: release

on:
  push:
    tags:
      - 'v*'

# No workflow-level permissions: each job requests only what it needs.
# The build job runs with the default read-only token; only `release` gets write.

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            installer_dir: install/windows
          - goos: darwin
            goarch: amd64
            ext: ''
            installer_dir: install/macos
          - goos: darwin
            goarch: arm64
            ext: ''
            installer_dir: install/macos
          - goos: linux
            goarch: amd64
            ext: ''
            installer_dir: install/linux

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p bundle
          go build -trimpath -ldflags "-s -w" -o "bundle/shield-id-helper${{ matrix.ext }}" .

      - name: Copy installer scripts
        run: cp -r ${{ matrix.installer_dir }}/* bundle/

      - name: Create zip bundle
        run: |
          cd bundle
          zip -r "../shield-id-helper-${{ matrix.goos }}-${{ matrix.goarch }}.zip" .

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shield-id-helper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: shield-id-helper-${{ matrix.goos }}-${{ matrix.goarch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release + upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
