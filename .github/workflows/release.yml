# Cross-build shield-id-helper and publish per-OS zip bundles to a GitHub Release.
#
# Triggered by pushing a tag matching v*. Each zip contains the binary + the
# OS-appropriate install/uninstall scripts so a customer can download one
# archive, extract it, and run `install.<sh|ps1> <extension-id>`.
#
# Cut a release with:
#   git tag v1.0.0 && git push --tags

name: release

on:
  push:
    tags:
      - 'v*'

# No workflow-level permissions: each job requests only what it needs.
# The build job runs with the default read-only token; only `release` gets write.

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            installer_dir: install/windows
          - goos: darwin
            goarch: amd64
            ext: ''
            installer_dir: install/macos
          - goos: darwin
            goarch: arm64
            ext: ''
            installer_dir: install/macos
          - goos: linux
            goarch: amd64
            ext: ''
            installer_dir: install/linux

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p bundle
          go build -trimpath -ldflags "-s -w" -o "bundle/shield-id-helper${{ matrix.ext }}" .

      - name: Copy installer scripts
        run: cp -r ${{ matrix.installer_dir }}/* bundle/

      - name: Create zip bundle
        run: |
          cd bundle
          zip -r "../shield-id-helper-${{ matrix.goos }}-${{ matrix.goarch }}.zip" .

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shield-id-helper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: shield-id-helper-${{ matrix.goos }}-${{ matrix.goarch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release + upload assets
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
