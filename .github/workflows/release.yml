# Cross-build shield-id-helper and publish per-OS zip bundles to a GitHub Release.
#
# Triggered by pushing a tag matching v*. Each zip contains the binary + the
# OS-appropriate install/uninstall scripts so a customer can download one
# archive, extract it, and run `install.<sh|ps1> <extension-id>`.
#
# Cut a release with:
#   git tag v1.0.0 && git push --tags

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create releases + upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            installer_dir: install/windows
          - goos: darwin
            goarch: amd64
            ext: ''
            installer_dir: install/macos
          - goos: darwin
            goarch: arm64
            ext: ''
            installer_dir: install/macos
          - goos: linux
            goarch: amd64
            ext: ''
            installer_dir: install/linux

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p bundle
          go build -trimpath -ldflags "-s -w" -o "bundle/shield-id-helper${{ matrix.ext }}" .

      - name: Copy installer scripts
        run: cp -r ${{ matrix.installer_dir }}/* bundle/

      - name: Create zip bundle
        run: |
          cd bundle
          zip -r "../shield-id-helper-${{ matrix.goos }}-${{ matrix.goarch }}.zip" .

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: shield-id-helper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: shield-id-helper-${{ matrix.goos }}-${{ matrix.goarch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
